name: Deploy

# Web: Vercel's Git integration deploys every push to main; Vercel reports it as the commit status "Vercel" (it creates no GitHub Deployment,
# so the deployment_status event never fires), which the smoke job below waits for.
# Database: apply supabase/migrations to the Supabase project when its secrets are present (supabase db push does nothing when there is nothing new).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

jobs:
  migrate:
    name: Apply database migrations
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: have
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ] && [ -n "$SUPABASE_PROJECT_ID" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD / SUPABASE_PROJECT_ID are not all set: migrations were not applied"; fi
      - if: steps.have.outputs.ok == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - if: steps.have.outputs.ok == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - if: steps.have.outputs.ok == 'true'
        run: supabase db push

  smoke:
    name: Smoke test of the live site
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://gt-box-and-foot-editor.vercel.app' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for Vercel to finish deploying this commit
        run: |
          for i in $(seq 1 60); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/status" --jq '[.statuses[] | select(.context == "Vercel")][0].state // "none"')
            echo "attempt $i: Vercel status = $state"
            if [ "$state" = "success" ]; then exit 0; fi
            if [ "$state" = "failure" ] || [ "$state" = "error" ]; then echo "::error::the Vercel deployment failed"; exit 1; fi
            sleep 10
          done
          echo "::error::Vercel did not report success within 10 minutes"; exit 1
      - run: npm ci
        working-directory: tests/e2e
      - run: node smoke.mjs "$SITE_URL"
        working-directory: tests/e2e
