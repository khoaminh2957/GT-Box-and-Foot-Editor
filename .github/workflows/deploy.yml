name: Deploy

# Web: Vercel's Git integration deploys every push to main (nothing to do here).
# Database: apply supabase/migrations to the Supabase project when its secrets are present.
# After each successful production deployment: a smoke test of the live site.

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
  deployment_status:

permissions:
  contents: read
  deployments: read

jobs:
  migrate:
    name: Apply database migrations
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: have
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ] && [ -n "$SUPABASE_PROJECT_ID" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD / SUPABASE_PROJECT_ID are not all set: migrations were not applied"; fi
      - if: steps.have.outputs.ok == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - if: steps.have.outputs.ok == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - if: steps.have.outputs.ok == 'true'
        run: supabase db push

  smoke:
    name: Smoke test of the live site
    if: github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://gt-box-and-foot-editor.vercel.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: tests/e2e
      - run: node smoke.mjs "$SITE_URL"
        working-directory: tests/e2e
